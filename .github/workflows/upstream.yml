# Monthly check (1st of the month, 14:00 UTC) for new Turndown / turndown-plugin-gfm changes.
# Opens (or updates) an issue labeled "upstream" when there's something to port.
name: Upstream check

on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/check-upstream.mjs --out report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream --color 0969da --description "Changes in Turndown to port" --force
          existing=$(gh issue list --label upstream --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "Turndown has changes to port" --label upstream --body-file report.md
          fi

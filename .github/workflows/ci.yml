# Runs the tests and checks that the committed build output is up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build output is committed
        run: |
          npm run build
          git diff --exit-code -- index.html || (echo "index.html is out of date: run 'npm run build' and commit it" && exit 1)
